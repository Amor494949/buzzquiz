<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BuzzQuiz</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="player">
<main id="join" class="card">
  <h1>BuzzQuiz</h1>
  <p class="muted">Buzz test (M0)</p>
  <form id="joinForm">
    <label>Room code
      <input id="code" autocomplete="off" autocapitalize="characters" maxlength="4" required pattern="[A-Za-z]{4}" placeholder="ABCD">
    </label>
    <label>Your name
      <input id="name" autocomplete="nickname" maxlength="20" required placeholder="Priya">
    </label>
    <button type="submit" class="primary">Join</button>
    <p id="joinError" class="error" role="alert"></p>
  </form>
</main>

<main id="game" hidden>
  <header class="me">
    <span id="avatar" class="avatar"></span>
    <span id="meName" class="me-name"></span>
    <span id="conn" class="conn">connecting</span>
  </header>
  <section class="status">
    <p id="status" class="status-text">Waiting for the host…</p>
    <p id="sub" class="muted"></p>
  </section>
  <button id="buzzer" class="buzzer locked" aria-live="polite">
    <span id="buzzLabel">LOCKED</span>
  </button>
  <footer id="diag" class="diag muted"></footer>
</main>

<script type="module">
import { connect, localNow } from "/net.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
$("code").value = (params.get("room") || localStorage.getItem("bq.code") || "").toUpperCase();
$("name").value = localStorage.getItem("bq.name") || "";

let pid = localStorage.getItem("bq.pid");
if (!pid) {
  pid = crypto.randomUUID();
  localStorage.setItem("bq.pid", pid);
}

let audio = null;
function click() {
  if (!audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.frequency.setValueAtTime(1400, t);
  o.frequency.exponentialRampToValueAtTime(600, t + 0.06);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + 0.09);
}

async function keepAwake() {
  try { await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && keepAwake());

let conn = null;
let round = null;
let localBuzz = null; // round number we buzzed in locally, for instant feedback

$("joinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("code").value.trim().toUpperCase();
  const name = $("name").value.trim();
  localStorage.setItem("bq.code", code);
  localStorage.setItem("bq.name", name);
  // Unlock sound on this user gesture (required by iOS).
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    await audio.resume();
  } catch {}
  keepAwake();
  start(code, name);
});

function start(code, name) {
  $("join").hidden = true;
  $("game").hidden = false;
  conn = connect(`/ws/${code}?role=player&pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(name)}`, {
    onStatus: (s) => {
      $("conn").textContent = s;
      $("conn").dataset.s = s;
      if (s === "removed" || s === "replaced") {
        $("status").textContent = s === "removed" ? "The host removed you." : "You joined from another tab.";
      }
    },
    onMessage: (m) => {
      if (m.t === "state") {
        $("avatar").textContent = m.me.emoji;
        $("avatar").style.background = m.me.color;
        $("meName").textContent = m.me.name;
        round = m.round;
        render();
      } else if (m.t === "buzzed" && round && m.n === round.n) {
        round.buzzed = true;
        round.place = m.place;
        render();
      }
    },
  });
  // Handshake failures (bad code, full room) show up as an immediate close.
  setTimeout(() => {
    if ($("conn").dataset.s === "offline" && !round) {
      $("status").textContent = "Can't join. Check the room code (or the room may be full).";
    }
  }, 2500);
  tick();
}

function phase() {
  if (!round) return "waiting";
  if (round.buzzed || localBuzz === round.n) return "buzzed";
  if (round.closed) return "over";
  if (!conn.sync.ready || conn.sync.serverNow() < round.openAt) return "armed";
  return "open";
}

let lastPhase = "";
function render() {
  const p = phase();
  const b = $("buzzer");
  b.className = "buzzer " + (p === "open" ? "open" : p === "buzzed" ? "done" : "locked");
  const label = { waiting: "LOCKED", armed: "GET READY", open: "BUZZ!", buzzed: "BUZZED", over: "LOCKED" }[p];
  $("buzzLabel").textContent = label;
  const status = {
    waiting: "Waiting for the host…",
    armed: `Round ${round?.n}: get ready…`,
    open: `Round ${round?.n}: buzzers open`,
    buzzed: round?.place ? `You buzzed: #${round.place} to arrive` : "You buzzed!",
    over: `Round ${round?.n} is over`,
  }[p];
  $("status").textContent = status;
  lastPhase = p;
}

function tick() {
  if (round && phase() !== lastPhase) render();
  const s = conn?.sync;
  if (s?.rtt != null) $("diag").textContent = `ping ${s.rtt.toFixed(0)} ms · best ${s.bestRtt.toFixed(0)} ms`;
  requestAnimationFrame(tick);
}

let tooEarlyTimer = null;
function onPress(e) {
  e.preventDefault();
  // e.timeStamp is when the finger touched the glass, measured from timeOrigin.
  const tapLocal = performance.timeOrigin + e.timeStamp;
  const p = phase();
  if (p === "armed") {
    $("sub").textContent = "Too early, wait for BUZZ!";
    clearTimeout(tooEarlyTimer);
    tooEarlyTimer = setTimeout(() => ($("sub").textContent = ""), 1200);
    return;
  }
  if (p !== "open") return;
  localBuzz = round.n;
  render(); // instant visual feedback
  click();
  try { navigator.vibrate?.(30); } catch {}
  conn.send({ t: "buzz", n: round.n, est: conn.sync.toServer(tapLocal), rtt: conn.sync.bestRtt });
}
$("buzzer").addEventListener("pointerdown", onPress);
// Stop the long-press menu and double-tap zoom on the buzzer.
$("buzzer").addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });

if (params.get("room") && $("name").value) {
  // Returning player opened a join link: one tap still needed for sound.
  $("name").focus();
}
</script>
</body>
</html>
